name: Release
on:
  push:
    tags: ['v*']
  # Manual runs only build and test, even when dispatched against a tag.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build & inspect package
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is_prerelease: ${{ steps.versions.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5
      # Builds the sdist and wheel with uv build, runs twine check --strict and
      # check-wheel-contents, renders the file trees and metadata into the job
      # summary, and uploads everything as the "Packages" artifact.
      - name: Build, check, and inspect the distributions
        id: baipp
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
      - name: Validate citation metadata
        run: uvx cffconvert --validate
      - name: Assert the package, citation, and tag versions agree
        id: versions
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PACKAGE_VERSION: ${{ steps.baipp.outputs.package_version }}
        run: |
          uv run --no-project --python 3.13 --with pyyaml --with packaging python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          import yaml
          from packaging.version import Version

          versions = {
              "pyproject.toml": tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"],
              "built package": os.environ["PACKAGE_VERSION"],
              "CITATION.cff": yaml.safe_load(Path("CITATION.cff").read_text())["version"],
          }
          if tag := os.environ["TAG"]:
              versions["tag"] = tag.removeprefix("v")
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Release versions do not match: {versions}")
          is_prerelease = Version(versions["built package"]).is_prerelease
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"is_prerelease={str(is_prerelease).lower()}", file=output)
          PY
  smoke:
    name: Wheel smoke / Python ${{ matrix.python-version }}
    needs: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      # The checkout supplies the smoke script. Isolated Python imports the installed wheel.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      # Import-only smoke passes even when the environment cannot start, which
      # is this package's most likely failure mode - so play a real episode.
      - name: Play Docker and WASM episodes from the installed wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -I scripts/smoke.py
  # CI runs uv sync --frozen everywhere else, so the lower bounds in
  # pyproject.toml are otherwise entirely untested.
  lowest-resolution:
    name: Test at the declared minimum versions
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.1.2
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Resolve the declared lower bounds and run the tests
        run: |
          uv sync --resolution lowest-direct
          uv run --no-sync pytest --tb=short
  publish-testpypi:
    name: Upload to TestPyPI
    needs: [build, smoke]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download the built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
  publish-pypi:
    name: Upload to PyPI
    needs: [publish-testpypi, lowest-resolution]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      # Emits PEP 740 attestations by default.
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  github-release:
    name: Create GitHub release
    needs: [build, publish-pypi]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease="$IS_PRERELEASE"
