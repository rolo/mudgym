name: Docs
# Build the zensical docs site and deploy it to GitHub Pages. The in-page
# transcripts are executed against a live MUD2 Docker image at build time, so
# the published docs show real game output.
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Only one concurrent Pages deployment; let a newer push cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.2
        with:
          enable-cache: true
      - name: Install docs dependencies
        run: uv sync --group docs
      # Re-capture the in-page transcripts against the live game so the
      # published pages show current output. They are committed too, so a local
      # `zensical build` still works without Docker - this just refreshes them.
      # Not diffed against the committed copies on purpose: the world has
      # weather, wandering mobiles, and other players, so runs likely won't match
      # (until we get seeding working).
      - name: Capture docs transcripts from the live game
        run: uv run python scripts/generate_docs_transcripts.py
      - name: Build docs site
        run: uv run zensical build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
