name: Docs
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.server_url == 'https://github.com' && (github.event.repository.visibility == 'public' ||


       github.event.repository.has_pages == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.2
        with:
          enable-cache: true
      - name: Install docs dependencies
        run: uv sync --group docs
      - name: Build docs site
        run: uv run python docs/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # increasing from the default of 10 minutes, although github is having an incident
          # with pages right now so this may be temporary
          timeout: 1800000
