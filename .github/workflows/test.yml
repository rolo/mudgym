name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read # checkout only; nothing here writes back to the repo
env:
  LOG_LEVEL: "DEBUG"
concurrency:
  # Deduplicate push and pull-request runs for the same commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.13'
          - '3.14'
    steps:
      - uses: actions/checkout@v5
      # Forgejo uses GH_PAT; GitHub falls back to its job token.
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.2
        with:
          enable-cache: true
          github-token: ${{ secrets.GH_PAT || github.token }}
      - name: Install dependencies
        run: just install
      - name: Verify matrix Python
        run: |
          uv run python - <<'PY'
          import os
          import sys

          expected = tuple(map(int, os.environ["UV_PYTHON"].split(".")))
          assert sys.version_info[:2] == expected, f"expected Python {expected}, got {sys.version}"
          PY
      - name: Run tests (with coverage)
        run: just test
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: '${{ github.workspace }}/.coverage*'
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: error
